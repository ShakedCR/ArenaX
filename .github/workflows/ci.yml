name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root deps
        run: npm ci

      - name: Verify server (install & build)
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Verify client (install & build)
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Run server tests (if any)
        working-directory: server
        run: |
          if npm run test --silent; then echo "server tests passed"; else echo "no server tests or tests failed"; fi

      - name: Run client tests (if any)
        working-directory: client
        run: |
          if npm run test --silent; then echo "client tests passed"; else echo "no client tests or tests failed"; fi
